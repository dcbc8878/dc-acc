<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ติดตามปิดงบ | เด็กชายบัญชี</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* หน้าเดียว 2 มุมมอง: รายชื่อลูกค้าของรอบปี (/customer/2569) และเช็คลิสต์รายลูกค้า (/customer/2569/EPED) — โทนแบรนด์เดียวกับหน้า 404/หน้าแรก */
:root{
  --brand:#0f4c81; --brand-soft:#E6EEF6; --brand-ink:#0B3A63;
  --paper:#F5F8FC; --surface:#FFFFFF; --sunk:#EDF2F8;
  --ink:#0F1A24; --body:#45566A; --faint:#7D8B9B;
  --rule:#DCE3EC; --rule-strong:#C2CCD8;
  --ok:#23704B; --ok-soft:#E3F1E9;
  --warn:#8A6414; --warn-soft:#F6EEDC;
  --bad:#A23B2C; --bad-soft:#F8E8E4;
  --na:#6C7280; --na-soft:#ECEDF0;
  --f-body:"Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#7FB2E5; --brand-soft:#16273A; --brand-ink:#A9CCF0;
    --paper:#0E141B; --surface:#151D26; --sunk:#1B2530;
    --ink:#E6ECF2; --body:#AAB6C3; --faint:#7B8896;
    --rule:#253140; --rule-strong:#344354;
    --ok:#6CC395; --ok-soft:#163023; --warn:#D7B064; --warn-soft:#2D2617;
    --bad:#E58C78; --bad-soft:#33201C; --na:#A0A6B2; --na-soft:#22252B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#7FB2E5; --brand-soft:#16273A; --brand-ink:#A9CCF0;
  --paper:#0E141B; --surface:#151D26; --sunk:#1B2530;
  --ink:#E6ECF2; --body:#AAB6C3; --faint:#7B8896;
  --rule:#253140; --rule-strong:#344354;
  --ok:#6CC395; --ok-soft:#163023; --warn:#D7B064; --warn-soft:#2D2617;
  --bad:#E58C78; --bad-soft:#33201C; --na:#A0A6B2; --na-soft:#22252B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15.5px; line-height:1.6; -webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--brand)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}

.top{background:var(--surface); border-bottom:1px solid var(--rule)}
.top-in,.wrap{max-width:74rem; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.top-in{display:flex; align-items:center; gap:.75rem; padding-block:.7rem; flex-wrap:wrap}
.top-in img{width:30px; height:30px}
.top-in .t{font-weight:700; color:var(--ink); text-decoration:none; flex:1; min-width:0}
.top-in .who{font-size:.82rem; color:var(--body)}
.wrap{padding-block:1.5rem 4rem}

.btn{cursor:pointer; border-radius:8px; padding:.45rem .95rem; border:1px solid var(--brand); background:var(--brand); color:var(--surface); font-weight:600; font-size:.9rem; white-space:nowrap}
.btn.ghost{background:transparent; color:var(--brand)}
.btn.small{padding:.25rem .65rem; font-size:.82rem}
.btn.danger{border-color:var(--bad); background:transparent; color:var(--bad)}
.btn:disabled{opacity:.5; cursor:not-allowed}
input.f,select.f,textarea.f{background:var(--surface); border:1px solid var(--rule-strong); border-radius:8px; padding:.45rem .6rem; width:100%}
label.fl{display:grid; gap:.2rem; font-size:.82rem; color:var(--body)}
.err{color:var(--bad); font-size:.86rem; margin:0}
.msg{border:1px solid var(--rule-strong); background:var(--surface); border-radius:10px; padding:.75rem .95rem; color:var(--body); font-size:.92rem}
.msg.bad{border-color:var(--bad); background:var(--bad-soft); color:var(--ink)}

/* login */
.login{max-width:24rem; margin:3rem auto; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:1.5rem; display:grid; gap:.8rem}
.login h1{margin:0; font-size:1.3rem}

/* list view */
.head{display:flex; flex-wrap:wrap; gap:.75rem 1rem; align-items:end; justify-content:space-between; margin-bottom:1.25rem}
.head h1{margin:0; font-size:clamp(1.4rem,3.4vw,1.9rem); line-height:1.25; text-wrap:balance}
.eyebrow{font-family:var(--f-mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--brand); margin:0 0 .3rem}
.yearbar{display:flex; gap:.35rem; flex-wrap:wrap}
.yearbar a{font-family:var(--f-mono); font-size:.85rem; text-decoration:none; padding:.25rem .65rem; border:1px solid var(--rule-strong); border-radius:999px; color:var(--body)}
.yearbar a[aria-current="page"]{background:var(--brand); border-color:var(--brand); color:var(--surface)}
.stats{display:flex; flex-wrap:wrap; gap:.4rem 1.4rem; font-size:.88rem; color:var(--body); margin:0 0 1rem}
.stats b{font-family:var(--f-mono); font-weight:500; color:var(--ink)}
.tools{display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem}
.tools input{max-width:18rem}

.tablebox{overflow-x:auto; background:var(--surface); border:1px solid var(--rule); border-radius:12px}
table.jobs{width:100%; border-collapse:collapse; font-size:.92rem; min-width:40rem}
table.jobs th{text-align:left; font-weight:600; font-size:.78rem; color:var(--body); padding:.6rem .8rem; border-bottom:1px solid var(--rule-strong); white-space:nowrap}
table.jobs td{padding:.6rem .8rem; border-bottom:1px solid var(--rule); vertical-align:middle}
table.jobs tr:last-child td{border-bottom:0}
table.jobs tbody tr{cursor:pointer}
table.jobs tbody tr:hover{background:var(--sunk)}
.cname a{color:var(--ink); text-decoration:none; font-weight:600}
.cname a:hover{color:var(--brand)}
.code{font-family:var(--f-mono); font-size:.8rem; color:var(--brand-ink)}
.prog{display:flex; align-items:center; gap:.5rem; min-width:9rem}
.bar{flex:1; height:6px; background:var(--sunk); border-radius:3px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--ok)}
.pct{font-family:var(--f-mono); font-size:.8rem; width:2.6rem; text-align:right}
.chip{display:inline-block; font-size:.74rem; padding:.08rem .5rem; border-radius:999px; white-space:nowrap; border:1px solid currentColor}
.st-Pending{color:var(--faint)}
.st-Preparing,.st-Draft{color:var(--warn); background:var(--warn-soft); border-color:transparent}
.st-Sent{color:var(--brand-ink); background:var(--brand-soft); border-color:transparent}
.st-Paid,.st-Uploaded{color:var(--ok); background:var(--ok-soft); border-color:transparent}
.walk{font-size:.7rem; color:var(--warn); border:1px solid var(--warn); border-radius:4px; padding:0 .3rem; margin-left:.35rem; white-space:nowrap}
.empty{background:var(--surface); border:1px dashed var(--rule-strong); border-radius:12px; padding:1.5rem; color:var(--body)}
.empty b{color:var(--ink)}

/* dialog */
.dlg-back{position:fixed; inset:0; background:rgba(10,20,30,.45); display:grid; place-items:center; padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index:20}
.dlg{background:var(--surface); border-radius:14px; width:100%; max-width:32rem; max-height:88vh; overflow:auto; padding:1.25rem; display:grid; gap:.9rem}
.dlg h2{margin:0; font-size:1.15rem}
.tabs{display:flex; gap:.3rem; border-bottom:1px solid var(--rule)}
.tabs button{cursor:pointer; background:none; border:0; border-bottom:2px solid transparent; padding:.4rem .7rem; color:var(--body); font-weight:600}
.tabs button[aria-selected="true"]{border-color:var(--brand); color:var(--brand)}
.pick{list-style:none; margin:0; padding:0; max-height:16rem; overflow:auto; border:1px solid var(--rule); border-radius:8px}
.pick li button{width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--rule); padding:.5rem .7rem; cursor:pointer; display:flex; gap:.6rem; align-items:baseline}
.pick li button:hover{background:var(--sunk)}
.pick li button:disabled{cursor:default; color:var(--faint)}
.pick .code{flex:0 0 4.5rem}
.grid2{display:grid; gap:.7rem; grid-template-columns:1fr}
@media (min-width:30rem){ .grid2{grid-template-columns:1fr 1fr} }
.row-end{display:flex; gap:.5rem; justify-content:flex-end; flex-wrap:wrap}

/* detail view */
.crumb{font-size:.85rem; margin:0 0 .75rem}
.crumb a{text-decoration:none}
.dhead{display:flex; flex-wrap:wrap; gap:.75rem 1.5rem; align-items:start; justify-content:space-between; margin-bottom:1rem}
.dhead h1{margin:0; font-size:clamp(1.3rem,3vw,1.75rem); line-height:1.3; text-wrap:balance}
.dhead .sub{color:var(--body); font-size:.88rem}
.dctl{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap}
.dctl label{font-size:.84rem; color:var(--body); display:flex; gap:.4rem; align-items:center}
.dctl select{width:auto}
.dlayout{display:grid; gap:1.5rem; grid-template-columns:1fr}
@media (min-width:60rem){ .dlayout{grid-template-columns:1fr 18rem; align-items:start} .side{position:sticky; top:1rem} }
.dlayout > *{min-width:0}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:1.1rem 1.2rem}
.filter{display:flex; gap:.35rem; flex-wrap:wrap; margin:0 0 1rem}
.filter button{cursor:pointer; border:1px solid var(--rule-strong); background:transparent; border-radius:999px; padding:.2rem .7rem; font-size:.82rem; color:var(--body)}
.filter button[aria-pressed="true"]{border-color:var(--brand); background:var(--brand-soft); color:var(--brand-ink)}
.grp{margin-bottom:1.6rem}
.grp:last-child{margin-bottom:0}
.ghead{display:flex; align-items:center; gap:.6rem; border-bottom:1px solid var(--rule-strong); padding-bottom:.4rem}
.mark{font-weight:700; color:var(--surface); background:var(--brand); width:1.7rem; height:1.7rem; border-radius:6px; display:grid; place-items:center; flex:0 0 auto}
.ghead h2{font-size:1.02rem; margin:0; flex:1}
.gcount{font-family:var(--f-mono); font-size:.75rem; color:var(--body)}
.gnote{color:var(--body); font-size:.85rem; margin:.45rem 0 .2rem; max-width:66ch}
ul.items{list-style:none; margin:0; padding:0}
ul.items li{border-bottom:1px solid var(--rule); padding:.6rem .1rem; display:grid; grid-template-columns:1fr auto; gap:.15rem 1rem; align-items:start}
ul.items li:last-child{border-bottom:0}
.iname{font-weight:600; line-height:1.45}
.tag{font-size:.68rem; font-weight:500; color:var(--bad); border:1px solid var(--bad); border-radius:4px; padding:0 .3rem; margin-left:.4rem; white-space:nowrap; vertical-align:.1em}
.ihint{grid-column:1; color:var(--body); font-size:.84rem; line-height:1.5}
.iwho{grid-column:1; font-size:.75rem; color:var(--faint)}
li.s-done .iname{color:var(--faint); text-decoration:line-through; text-decoration-color:var(--rule-strong)}
li.s-na .iname{color:var(--faint)}
.seg{grid-row:1 / span 3; grid-column:2; display:inline-flex; border:1px solid var(--rule-strong); border-radius:8px; overflow:hidden; align-self:center}
.seg button{cursor:pointer; border:0; background:transparent; padding:.3rem .6rem; font-size:.8rem; color:var(--body); white-space:nowrap}
.seg button + button{border-left:1px solid var(--rule-strong)}
.seg button[aria-pressed="true"].b-wait{background:var(--sunk); color:var(--ink)}
.seg button[aria-pressed="true"].b-done{background:var(--ok); color:var(--surface)}
.seg button[aria-pressed="true"].b-na{background:var(--na-soft); color:var(--na)}
.seg button:disabled{cursor:progress}
@media (max-width:32rem){
  ul.items li{grid-template-columns:1fr}
  .seg{grid-row:auto; grid-column:1; justify-self:start; margin-top:.3rem}
}
.side{display:grid; gap:1rem}
.sumrow{display:flex; justify-content:space-between; font-size:.9rem; padding:.25rem 0}
.sumrow b{font-family:var(--f-mono); font-weight:500}
.side textarea{min-height:8rem; resize:vertical; line-height:1.5}
.saved{font-size:.75rem; color:var(--faint); min-height:1.1em; margin:.3rem 0 0}
.side h2{font-size:.95rem; margin:0 0 .5rem}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(1rem + env(safe-area-inset-bottom, 0px)); background:var(--ink); color:var(--paper); padding:.5rem 1rem; border-radius:999px; font-size:.88rem; z-index:30}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <img src="/logo.png" alt="">
    <a class="t" href="/customer/" data-nav>ติดตามปิดงบการเงิน</a>
    <span class="who" id="who"></span>
    <button class="btn ghost small" id="logout" type="button" hidden>ออกจากระบบ</button>
  </div>
</header>

<div class="wrap">
  <p class="msg" id="boot">กำลังโหลด…</p>

  <form class="login" id="login" hidden>

    <label class="fl">อีเมล<input class="f" id="lg-email" type="email" autocomplete="username" required></label>
    <label class="fl">รหัสผ่าน<input class="f" id="lg-pass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lg-err" hidden></p>
    <button class="btn" id="lg-btn" type="submit">เข้าสู่ระบบ</button>
  </form>

  <section id="v-list" hidden></section>
  <section id="v-detail" hidden></section>
</div>

<div class="dlg-back" id="dlg" hidden></div>
<div class="toast" id="toast" hidden></div>

  function el(tag, attrs, kids){

  function parseRoute(){
    var p = location.pathname.replace(/^\/customer\/?/, "");
    var q = new URLSearchParams(location.search).get("p");
    if (q) { p = q.replace(/^\//, ""); history.replaceState(null, "", "/customer/" + p.replace(/\/$/, "")); }
    var parts = p.split("/").filter(Boolean);
    route.year = /^25\d\d$/.test(parts[0] || "") ? +parts[0] : null;
    route.code = parts[1] ? decodeURIComponent(parts[1]).toUpperCase() : null;

    var a = e.target.closest && e.target.closest("a[data-nav]");

    sb.auth.getSession().then(function(r){
      var s = r.data && r.data.session;

      me.id = s.user.id;

        }

  // ── list view ──
  function loadYears(){
    return sb.from("crm_fs_jobs").select("year_be").then(function(r){
      if (r.error) throw r.error;
      var ys = {}; (r.data || []).forEach(function(x){ ys[x.year_be] = 1; });
      ys[thisYearBE()] = 1; ys[thisYearBE() - 1] = 1;

  function defaultYear(){

    var v = $("v-detail"); $("v-list").hidden = true; v.hidden = false;
    v.innerHTML = ""; v.appendChild(el("p",{class:"msg", text:"กำลังโหลด…"}));
    sb.from("crm_clients").select("id,code,thai_name,billing_type,tax_number").eq("code", route.code).maybeSingle().then(function(r){
      if (r.error) throw r.error;
      if (!r.data) return notFound("ไม่พบลูกค้ารหัส " + route.code);
      var c = r.data;
      return sb.from("crm_fs_jobs").select(JOB_COLS).eq("client_id", c.id).eq("year_be", route.year).maybeSingle().then(function(jr){
        if (jr.error) throw jr.error;
        if (!jr.data) return notFound(c.thai_name + " ยังไม่มีงานปิดงบรอบปี " + route.year, c);
        cache.job = jr.data; renderDetail();
      });
    }).catch(function(e){ v.innerHTML = ""; v.appendChild(el("p",{class:"msg bad", text: friendly(e)})); });
  }
  function notFound(text, c){
    var v = $("v-detail"); v.innerHTML = "";
    v.appendChild(el("p",{class:"crumb"},[ el("a",{href:"/customer/" + route.year, "data-nav":true, text:"← รายชื่อปี " + route.year}) ]));
    var box = el("div",{class:"empty"},[ el("b",{text:text}) ]);
    if (c){
      box.appendChild(el("br"));
      box.appendChild(el("button",{class:"btn", type:"button", style:"margin-top:.75rem", text:"เปิดงานปิดงบรอบปี " + route.year, on:{click:function(){
        var b = this; b.disabled = true;
        sb.from("crm_fs_jobs").insert({ client_id:c.id, year_be:route.year }).then(function(r){ if (r.error){ b.disabled = false; toast(friendly(r.error)); return; } showDetail(); });
      }}}));
    }
    v.appendChild(box);
  }

  var noteTimer = null, busy = {};
  function renderDetail(){
    var j = cache.job, c = j.crm_clients, v = $("v-detail"), p = progress(j);
    document.title = c.code + " ปิดงบ " + j.year_be + " | เด็กชายบัญชี";
    var keepNote = document.activeElement && document.activeElement.id === "note" ? $("note").value : null;
    v.innerHTML = "";
    v.appendChild(el("p",{class:"crumb"},[ el("a",{href:"/customer/" + j.year_be, "data-nav":true, text:"← รายชื่อปี " + j.year_be}) ]));

    var stSel = el("select",{class:"f", id:"status"});
    STATUSES.forEach(function(s){ stSel.appendChild(el("option",{value:s, selected: (j.status || "Pending") === s, text: STATUS_TH[s] + " · " + s})); });
    stSel.addEventListener("change", function(){
      var val = stSel.value; stSel.disabled = true;
      sb.from("crm_fs_jobs").update({ status: val }).eq("id", j.id).then(function(r){
        stSel.disabled = false;
        if (r.error){ toast(friendly(r.error)); stSel.value = j.status; return; }
        j.status = val; toast("เปลี่ยนสถานะแล้ว");
      });
    });
    v.appendChild(el("div",{class:"dhead"},[
      el("div",null,[
        el("h1",null,[ c.thai_name, c.billing_type === "walkin" ? el("span",{class:"walk", text:"ขาจร"}) : null ]),
        el("div",{class:"sub"},[ el("span",{class:"code", text:c.code}), " · รอบปี " + j.year_be + (c.tax_number ? " · " + c.tax_number : "") ])
      ]),
      el("div",{class:"dctl"},[ el("label",{for:"status"},[ "สถานะงาน", stSel ]) ])
    ]));

    var main = el("div",{class:"card"});
    var fb = el("div",{class:"filter", role:"group", "aria-label":"กรองรายการ"});
    [["all","ทั้งหมด"],["wait","เฉพาะที่ยังรอ"]].forEach(function(f){
      fb.appendChild(el("button",{type:"button", "aria-pressed": String(filter === f[0]), text:f[1], on:{click:function(){ filter = f[0]; lsSet("dcbc-fs-filter", filter); renderDetail(); }}}));
    });
    main.appendChild(fb);

    GROUPS.forEach(function(g){
      var items = g.items.filter(function(it){ return filter === "all" || !itemState(j, it.id); });
      if (!items.length) return;
      var gdone = g.items.filter(function(it){ return itemState(j, it.id); }).length;
      var ul = el("ul",{class:"items"});
      items.forEach(function(it){
        var s = itemState(j, it.id), rec = j.checks && j.checks[it.id];
        var name = el("span",{class:"iname", text:it.name});
        if (it.tag) name.appendChild(el("span",{class:"tag", text:it.tag}));
        var who = rec && rec.s ? el("span",{class:"iwho", text:(rec.s === "done" ? "ได้แล้ว" : "ไม่เกี่ยว") + " · " + fmtDate(rec.at) + (staffNames[rec.by] ? " · " + staffNames[rec.by] : "")}) : null;
        var dis = !!busy[it.id];
        ul.appendChild(el("li",{class: s ? "s-" + s : null},[
          name,
          el("span",{class:"seg", role:"group", "aria-label":it.name},[
            el("button",{type:"button", class:"b-wait", "aria-pressed": String(!s), disabled:dis, text:"รอ", on:{click:function(){ if (s) setCheck(it.id, null); }}}),
            el("button",{type:"button", class:"b-done", "aria-pressed": String(s === "done"), disabled:dis, text:"ได้แล้ว", on:{click:function(){ setCheck(it.id, s === "done" ? null : "done"); }}}),
            el("button",{type:"button", class:"b-na", "aria-pressed": String(s === "na"), disabled:dis, text:"ไม่เกี่ยว", on:{click:function(){ setCheck(it.id, s === "na" ? null : "na"); }}})
          ]),
          it.hint ? el("span",{class:"ihint", text:it.hint}) : null,
          who
        ]));
      });
      main.appendChild(el("div",{class:"grp"},[
        el("div",{class:"ghead"},[ el("span",{class:"mark", text:g.k}), el("h2",{text:g.title}), el("span",{class:"gcount", text:gdone + "/" + g.items.length}) ]),
        g.note ? el("p",{class:"gnote", text:g.note}) : null,
        ul
      ]));
    });

    var ta = el("textarea",{class:"f", id:"note", placeholder:"เช่น ขาด statement เดือน 3 บัญชี SCB, ผู้สอบขอสัญญาเช่าเพิ่ม"});
    ta.value = keepNote !== null ? keepNote : (j.note || "");
    var saved = el("p",{class:"saved", id:"saved"});
    ta.addEventListener("input", function(){
      saved.textContent = "กำลังพิมพ์…"; clearTimeout(noteTimer);
      noteTimer = setTimeout(function(){
        var val = ta.value;
        sb.from("crm_fs_jobs").update({ note: val }).eq("id", j.id).then(function(r){
          var sv = $("saved"); if (!sv) return;
          if (r.error){ sv.textContent = friendly(r.error); return; }
          j.note = val; sv.textContent = "บันทึกแล้ว";
        });
      }, 900);
    });

    var side = el("aside",{class:"side"},[
      el("div",{class:"card"},[
        el("h2",{text:"ความคืบหน้า " + p.pct + "%"}),
        el("div",{class:"bar", style:"margin-bottom:.6rem"},[ (function(){ var i = el("i"); i.style.width = p.pct + "%"; return i; })() ]),
        el("div",{class:"sumrow"},[ "ได้แล้ว", el("b",{text:String(p.done)}) ]),
        el("div",{class:"sumrow"},[ "ไม่เกี่ยว", el("b",{text:String(p.na)}) ]),
        el("div",{class:"sumrow"},[ "ยังรอ", el("b",{text:String(p.wait)}) ])
      ]),
      el("div",{class:"card"},[ el("label",{for:"note"},[ el("h2",{text:"บันทึก / เอกสารที่ยังขาด"}) ]), ta, saved ])
    ]);
    if (me.role === "owner" || me.role === "manager"){
      var del = el("button",{class:"btn danger small", type:"button", text:"ลบงานปิดงบรอบปีนี้"});
      var armed = false;
      del.addEventListener("click", function(){
        if (!armed){ armed = true; del.textContent = "กดอีกครั้งเพื่อยืนยัน"; setTimeout(function(){ armed = false; del.textContent = "ลบงานปิดงบรอบปีนี้"; }, 4000); return; }
        del.disabled = true;
        sb.from("crm_fs_jobs").delete().eq("id", j.id).then(function(r){
          if (r.error){ del.disabled = false; toast(friendly(r.error)); return; }
          toast("ลบงานแล้ว (ข้อมูลลูกค้าใน CRM ยังอยู่)"); go("/customer/" + j.year_be);
        });
      });
      side.appendChild(el("div",{class:"card"},[ del, el("p",{class:"saved", text:"ลบเฉพาะเช็คลิสต์ของรอบปีนี้ ไม่ลบลูกค้า"}) ]));
    }
    v.appendChild(el("div",{class:"dlayout"},[ main, side ]));
    if (keepNote !== null){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }

  function setCheck(key, state){
    var j = cache.job; busy[key] = 1; renderDetail();
    sb.rpc("crm_fs_set_check", { p_job_id:j.id, p_key:key, p_state:state }).then(function(r){
      delete busy[key];
      if (r.error){ toast(friendly(r.error)); renderDetail(); return; }
      j.checks = r.data || {}; renderDetail();
    });
  }

  // ดึงข้อมูลล่าสุดเมื่อกลับมาที่แท็บ (คนอื่นอาจติ๊กไปแล้ว)
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState !== "visible" || !me.role || !$("dlg").hidden) return;
    if (route.code && cache.job){
      sb.from("crm_fs_jobs").select(JOB_COLS).eq("id", cache.job.id).maybeSingle().then(function(r){ if (r.data){ cache.job = r.data; renderDetail(); } });
    }
  });

  if (!sb){ $("boot").className = "msg bad"; $("boot").textContent = "โหลดระบบไม่สำเร็จ ลองรีเฟรชหน้า"; return; }
  start();
})();
</script>
</body>
</html>
