<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>ระบบภายใน เด็กชายบัญชี</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  /* palette matches the CRM reference (เด็กชายบัญชี ตอนนี้): slate neutrals + blue accent */
  :root {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --surface-2: #F1F5F9;
    --ink: #0F172A;
    --ink-muted: #64748B;
    --border: #E2E8F0;
    --accent: #2563EB;
    --accent-soft: #3B82F6;
    --accent-contrast: #FFFFFF;
    --ring: rgba(37,99,235,0.35);
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -12px rgba(15,23,42,0.12);
    --shadow-lg: 0 4px 8px rgba(15,23,42,0.06), 0 20px 40px -16px rgba(15,23,42,0.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F172A;
      --surface: #1E293B;
      --surface-2: #334155;
      --ink: #F1F5F9;
      --ink-muted: #94A3B8;
      --border: #334155;
      --accent: #3B82F6;
      --accent-soft: #2563EB;
      --accent-contrast: #FFFFFF;
      --ring: rgba(59,130,246,0.4);
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.5);
      --shadow-lg: 0 4px 8px rgba(0,0,0,0.3), 0 20px 40px -16px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F172A; --surface: #1E293B; --surface-2: #334155;
    --ink: #F1F5F9; --ink-muted: #94A3B8; --border: #334155;
    --accent: #3B82F6; --accent-soft: #2563EB; --accent-contrast: #FFFFFF;
    --ring: rgba(59,130,246,0.4);
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.5);
    --shadow-lg: 0 4px 8px rgba(0,0,0,0.3), 0 20px 40px -16px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Sarabun', 'Noto Sans Thai', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-columns: 72px 1fr;
    grid-template-rows: 60px 1fr;
    grid-template-areas: "top top" "nav main";
    height: 100vh;
    overflow: hidden;
  }

  /* ── top bar ── */
  .topbar {
    grid-area: top;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 22px;
  }
  .topbar .mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(155deg, var(--accent-soft), var(--accent));
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-contrast); font-weight: 700; font-size: 0.82rem;
    flex-shrink: 0;
  }
  .topbar .name { font-weight: 600; font-size: 0.95rem; }
  .topbar .page-title {
    margin-left: auto;
    font-size: 0.86rem;
    color: var(--ink-muted);
  }

  /* ── side nav ── */
  .sidenav {
    grid-area: nav;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 0;
  }
  .nav-item {
    width: 48px; height: 48px;
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-muted);
    cursor: pointer;
    border: none;
    background: transparent;
    margin-bottom: 6px;
    transition: background 0.14s ease, color 0.14s ease;
    position: relative;
  }
  .nav-item svg { width: 21px; height: 21px; }
  .nav-item:hover { background: var(--surface-2); color: var(--accent); }
  .nav-item.active { background: var(--surface-2); color: var(--accent); }
  .nav-item.active::before {
    content: "";
    position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 20px; border-radius: 0 3px 3px 0;
    background: var(--accent);
  }
  .nav-item .dot {
    position: absolute; top: 6px; right: 6px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    display: none;
  }
  .nav-item.pending .dot { display: block; }
  .nav-sep { width: 32px; height: 1px; background: var(--border); margin: 8px 0 12px; }
  .nav-spacer { flex-grow: 1; }
  .nav-item.settings { margin-bottom: 4px; }

  .nav-tooltip {
    position: absolute; left: 62px; top: 50%; transform: translateY(-50%);
    background: var(--ink); color: var(--bg);
    font-size: 0.76rem; font-weight: 500;
    padding: 5px 10px; border-radius: 7px;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.12s ease;
    z-index: 30;
  }
  .nav-item:hover .nav-tooltip { opacity: 1; }

  /* ── main content ── */
  .main {
    grid-area: main;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  .page {
    position: absolute; inset: 0;
    display: none;
  }
  .page.active { display: block; }
  .page iframe {
    width: 100%; height: 100%; border: 0; display: block;
    background: var(--surface);
  }

  /* ── floating AI button ── */
  .ai-fab {
    position: fixed; right: 26px; bottom: 26px;
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(155deg, var(--accent-soft), var(--accent));
    color: var(--accent-contrast);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg);
    z-index: 40;
    transition: transform 0.16s ease;
  }
  .ai-fab:hover { transform: translateY(-2px) scale(1.04); }
  .ai-fab:focus-visible { outline: none; box-shadow: var(--shadow-lg), 0 0 0 4px var(--ring); }
  .ai-fab svg { width: 26px; height: 26px; }
  .ai-fab-label {
    position: fixed; right: 96px; bottom: 44px;
    background: var(--ink); color: var(--bg);
    font-size: 0.78rem; font-weight: 500;
    padding: 6px 12px; border-radius: 8px;
    z-index: 40;
    opacity: 0; pointer-events: none;
    transition: opacity 0.14s ease;
  }
  .ai-fab:hover ~ .ai-fab-label,
  .ai-fab:focus-visible ~ .ai-fab-label { opacity: 1; }

  /* ── AI chat panel ── */
  .ai-panel-backdrop {
    position: fixed; inset: 0; background: rgba(30,24,20,0.32);
    z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.16s ease;
  }
  .ai-panel-backdrop.open { opacity: 1; pointer-events: auto; }
  .ai-panel {
    position: fixed; right: 26px; bottom: 26px;
    width: min(380px, calc(100vw - 40px));
    height: min(560px, calc(100vh - 90px));
    background: var(--surface);
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
    z-index: 55;
    display: flex; flex-direction: column;
    overflow: hidden;
    transform: translateY(16px) scale(0.98);
    opacity: 0; pointer-events: none;
    transition: transform 0.16s ease, opacity 0.16s ease;
  }
  .ai-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
  .ai-panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .ai-panel-head .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(155deg, var(--accent-soft), var(--accent));
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-contrast); flex-shrink: 0;
  }
  .ai-panel-head .avatar svg { width: 18px; height: 18px; }
  .ai-panel-head .who { display: flex; flex-direction: column; gap: 1px; }
  .ai-panel-head .who b { font-size: 0.9rem; font-weight: 600; }
  .ai-panel-head .who span { font-size: 0.74rem; color: var(--ink-muted); }
  .ai-panel-close {
    margin-left: auto; width: 28px; height: 28px; border-radius: 8px;
    border: none; background: transparent; color: var(--ink-muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .ai-panel-close:hover { background: var(--border); color: var(--ink); }
  .ai-panel-close svg { width: 16px; height: 16px; }
  .ai-panel-body {
    flex-grow: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 28px;
    gap: 12px;
  }
  .ai-panel-body .icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--surface-2); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .ai-panel-body .icon svg { width: 24px; height: 24px; }
  .ai-panel-body p { font-size: 0.86rem; color: var(--ink-muted); line-height: 1.7; margin: 0; max-width: 26ch; }
  .ai-panel-body .status {
    font-size: 0.72rem; font-weight: 500; color: var(--accent);
    background: var(--surface-2); padding: 4px 12px; border-radius: 999px;
  }

  @media (prefers-reduced-motion: reduce) {
    .nav-item, .ai-fab, .ai-panel, .ai-panel-backdrop, .nav-tooltip, .ai-fab-label { transition: none; }
  }

  /* ── login gate ── */
  body { display: block; }
  #app { display: grid; grid-template-columns: 72px 1fr; grid-template-rows: 60px 1fr; grid-template-areas: "top top" "nav main"; height: 100vh; overflow: hidden; }
  .login-screen {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); padding: 20px;
  }
  .login-card {
    width: 100%; max-width: 340px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow-lg); padding: 32px 28px;
  }
  .login-card .mark {
    width: 40px; height: 40px; border-radius: 11px; margin: 0 auto 16px;
    background: linear-gradient(155deg, var(--accent-soft), var(--accent));
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-contrast); font-weight: 700; font-size: 0.95rem;
  }
  .login-card h1 { font-size: 1.05rem; font-weight: 700; text-align: center; margin: 0 0 4px; }
  .login-card p.sub { font-size: 0.8rem; color: var(--ink-muted); text-align: center; margin: 0 0 22px; }
  .login-card label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--ink-muted); margin: 0 0 6px; }
  .login-card input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 14px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
    color: var(--ink); font-family: inherit; font-size: 0.9rem;
  }
  .login-card input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .login-card button {
    width: 100%; padding: 11px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(155deg, var(--accent-soft), var(--accent)); color: var(--accent-contrast);
    font-family: inherit; font-size: 0.9rem; font-weight: 600; margin-top: 4px;
  }
  .login-card button:disabled { opacity: 0.6; cursor: default; }
  .login-error {
    font-size: 0.8rem; color: #DC2626; background: #FEF2F2; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 14px; display: none;
  }
  .login-error.show { display: block; }
  .pw-field { position: relative; margin-bottom: 14px; }
  #loginPass { margin-bottom: 0; padding-right: 40px; }
  /* #pwToggle (id selector) deliberately outranks the generic ".login-card
     button" rule above (which sets width:100%/padding/blue background) --
     with plain ".pw-toggle" that rule won, silently stretching this button
     to full width and hiding the password input completely underneath it. */
  #pwToggle {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; padding: 0; border: none; border-radius: 8px;
    background: transparent; color: var(--ink-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #pwToggle:hover { background: var(--surface-2); color: var(--ink); }
  #pwToggle svg { width: 18px; height: 18px; }
  .logout-btn {
    margin-left: 12px; width: 30px; height: 30px; border-radius: 8px; border: none;
    background: transparent; color: var(--ink-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .logout-btn:hover { background: var(--surface-2); color: var(--ink); }
  .logout-btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="mark">DC</div>
    <h1>ระบบภายใน เด็กชายบัญชี</h1>
    <p class="sub">เข้าสู่ระบบก่อนใช้งาน</p>
    <div class="login-error" id="loginError"></div>
    <label for="loginUser">ชื่อผู้ใช้</label>
    <input id="loginUser" type="text" autocomplete="username" required />
    <label for="loginPass">รหัสผ่าน</label>
    <div class="pw-field">
      <input id="loginPass" type="password" autocomplete="current-password" required />
      <button type="button" class="pw-toggle" id="pwToggle" aria-label="แสดงรหัสผ่าน" tabindex="-1">
        <svg id="pwEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button type="submit" id="loginBtn">เข้าสู่ระบบ</button>
  </form>
</div>

<div id="app" style="display:none">
  <header class="topbar">
    <div class="mark">DC</div>
    <span class="name">เด็กชายบัญชี</span>
    <span class="page-title" id="pageTitle">CRM ลูกค้า</span>
    <button class="logout-btn" id="logoutBtn" aria-label="ออกจากระบบ" title="ออกจากระบบ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </header>

  <nav class="sidenav">
    <button class="nav-item active" data-page="crm" aria-label="CRM ลูกค้า">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="nav-tooltip">CRM ลูกค้า</span>
    </button>
    <button class="nav-item" data-page="calendar" aria-label="ปฏิทินงาน">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span class="nav-tooltip">ปฏิทินงาน</span>
    </button>
    <div class="nav-sep"></div>
    <div class="nav-spacer"></div>
    <button class="nav-item settings" data-page="staff" aria-label="พนักงาน/ทีม">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      <span class="nav-tooltip">พนักงาน/ทีม</span>
    </button>
  </nav>

  <main class="main">
    <div class="page active" id="page-crm">
      <iframe data-src="./staging/crm/index.html" title="CRM ลูกค้า"></iframe>
    </div>
    <div class="page" id="page-calendar">
      <iframe data-src="./staging/calendar/index.html" title="ปฏิทินงาน"></iframe>
    </div>
    <div class="page" id="page-staff">
      <iframe data-src="./staging/staff/index.html" title="พนักงาน/ทีม"></iframe>
    </div>
  </main>

  <button class="ai-fab" id="aiFab" aria-label="เปิดแชทน้องบัญชี">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  </button>
  <span class="ai-fab-label">น้องบัญชี</span>

  <div class="ai-panel-backdrop" id="aiBackdrop"></div>
  <div class="ai-panel" id="aiPanel" role="dialog" aria-label="แชทน้องบัญชี">
    <div class="ai-panel-head">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </div>
      <div class="who"><b>น้องบัญชี</b><span>ผู้ช่วย AI</span></div>
      <button class="ai-panel-close" id="aiClose" aria-label="ปิด">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="ai-panel-body">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <p>ตอนนี้น้องบัญชีทำงานผ่านไลน์อยู่ (ถาม/ตอบ, งาน, เตือนความจำ, อ่านเอกสาร) กำลังเตรียมให้คุยหน้าเว็บนี้ได้เหมือนกัน</p>
      <span class="status">เร็วๆ นี้</span>
    </div>
  </div>
</div>

<script>
  const SB_URL  = 'https://dqegkyobclqqichhnxfm.supabase.co';
  const SB_ANON = 'sb_publishable_4U_v9BIrQjKppfchaevA6Q_zWj3zkxE';
  // Default config already persists the session to localStorage and keeps it
  // refreshed (that's supabase-js's out-of-the-box behavior) -- staying signed
  // in across page reloads/browser restarts already works from this alone.
  //
  // Tried making this shell the single auto-refresh "owner" (with the CRM/
  // Calendar iframes' own clients set to autoRefreshToken:false) to avoid a
  // theoretical multi-client refresh race -- that made things WORSE in
  // practice (reported: login succeeds, then immediately bounces back to the
  // login screen), so it was reverted. All clients now use plain defaults
  // again. If a real refresh-race bug shows up, investigate live (this
  // sandbox has no real network to reproduce/verify it) before changing this.
  const sb = supabase.createClient(SB_URL, SB_ANON);

  const loginScreen = document.getElementById('loginScreen');
  const appEl = document.getElementById('app');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginPass = document.getElementById('loginPass');
  const pwToggle = document.getElementById('pwToggle');
  const pwEyeIcon = document.getElementById('pwEyeIcon');
  const PW_EYE_OPEN = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
  const PW_EYE_OFF = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-3.22 4.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  pwToggle.addEventListener('click', () => {
    const show = loginPass.type === 'password';
    loginPass.type = show ? 'text' : 'password';
    pwEyeIcon.innerHTML = show ? PW_EYE_OFF : PW_EYE_OPEN;
    pwToggle.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
  });

  let iframesLoaded = false;
  function loadIframes() {
    if (iframesLoaded) return;
    iframesLoaded = true;
    // Wait until a real session exists (and is written to localStorage) before
    // the sub-apps' own JS ever runs its own getSession() check on load --
    // otherwise each iframe loads too early, sees no session yet, and gets
    // stuck showing its own login screen even after the shell logs in.
    document.querySelectorAll('#app iframe[data-src]').forEach(f => {
      f.src = f.dataset.src;
    });
  }
  function showApp() { loginScreen.style.display = 'none'; appEl.style.display = 'grid'; loadIframes(); }
  function showLogin() { appEl.style.display = 'none'; loginScreen.style.display = 'flex'; }

  async function checkSession() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) showApp(); else showLogin();
  }
  checkSession();

  // Only an explicit SIGNED_OUT should ever hide the app again -- reacting to
  // "session is falsy" on every event was closing the app on a late/stale
  // INITIAL_SESSION callback that can fire (with no session, since it reflects
  // page-load time) even after a real sign-in already succeeded.
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') { showLogin(); return; }
    if (session) showApp();
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.classList.remove('show');
    const raw = document.getElementById('loginUser').value.trim();
    const email = raw.includes('@') ? raw : `${raw.toLowerCase()}@staff.dcbc.co.th`;
    const password = document.getElementById('loginPass').value;
    loginBtn.disabled = true;
    loginBtn.textContent = 'กำลังเข้าสู่ระบบ...';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    loginBtn.disabled = false;
    loginBtn.textContent = 'เข้าสู่ระบบ';
    if (error) {
      loginError.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
      loginError.classList.add('show');
      return;
    }
    // Don't rely purely on the async onAuthStateChange event to transition --
    // show the app immediately once signInWithPassword itself confirms a session.
    if (data && data.session) showApp();
  });

  logoutBtn.addEventListener('click', () => sb.auth.signOut());

  const navItems = document.querySelectorAll('.nav-item');
  const pages = document.querySelectorAll('.page');
  const pageTitle = document.getElementById('pageTitle');
  const TITLES = { crm: 'CRM ลูกค้า', calendar: 'ปฏิทินงาน', staff: 'พนักงาน/ทีม' };

  navItems.forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.page;
      navItems.forEach(b => b.classList.toggle('active', b === btn));
      pages.forEach(p => p.classList.toggle('active', p.id === 'page-' + key));
      pageTitle.textContent = TITLES[key] || '';
    });
  });

  const aiFab = document.getElementById('aiFab');
  const aiPanel = document.getElementById('aiPanel');
  const aiBackdrop = document.getElementById('aiBackdrop');
  const aiClose = document.getElementById('aiClose');
  function openAi() { aiPanel.classList.add('open'); aiBackdrop.classList.add('open'); }
  function closeAi() { aiPanel.classList.remove('open'); aiBackdrop.classList.remove('open'); }
  aiFab.addEventListener('click', openAi);
  aiClose.addEventListener('click', closeAi);
  aiBackdrop.addEventListener('click', closeAi);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAi(); });
</script>
</body>
</html>
