<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เด็กชายบัญชี | ระบบภายใน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --brand-light:#FFF2E8; --brand:#FFB88C; --brand-dark:#E5976A; --ink:#3A3532; --ink-muted:#8A8078; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Prompt', sans-serif; background: var(--brand-light); color: var(--ink);
    text-align: center; padding: 24px;
  }
  .card { max-width: 440px; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--ink-muted); line-height: 1.6; margin: 0 0 4px; }
  .badge {
    display: inline-block; margin-top: 20px; padding: 6px 16px; border-radius: 999px;
    background: var(--brand); color: #4A2E1B; font-size: 0.85rem; font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>ระบบภายใน — เด็กชายบัญชี</h1>
    <p>CRM · ปฏิทินงาน · ผู้ช่วย AI</p>
    <p>กำลังเตรียมระบบ</p>
    <span class="badge">Coming soon</span>
  </div>
</body>
</html>
